<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.name | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if site.google_verification %}
    <meta name="google-site-verification" content="{{ site.google_verification | escape }}">
  {% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata:400,700&amp;display=swap">
  {% assign asset_version = site.time | date: '%s' %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ asset_version }}">
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ asset_version }}" defer></script>
</head>
<body>
  <main class="wrapper">
    {{ content }}
  </main>
</body>
</html>
